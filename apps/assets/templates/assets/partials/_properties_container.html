<div class="overflow-show rounded-lg border border-base-300 max-w-6xl mx-auto mb-5" id="costs-container">
  <table class="table">
    {% if properties %}
      <thead class="bg-base-200 text-base-content">
        <tr>
          <th class="px-6">Property</th>
          <th class="px-6 w-36">Amount Owing</th>
          <th class="px-6 w-36">Value</th>
          <th class="px-6 w-36">Net value</th>
          <th class="px-6 w-36"></th>
        </tr>
      </thead>

      <tbody>
        {% for property in properties %}
          <tr class="hover:bg-base-300 {% if request.GET.updated == property.id|slugify %}animate-flash-green{% endif %}">
            <td>{{ property.name }}</td>
            <td>${{ property.amount_owing }}</td>
            <td>${{ property.value }}</td>
            <td>${{ property.net_value }}</td>
            <td>

              <div class="dropdown w-full">
                <div tabindex="0" role="button" class="btn btn-sm btn-soft w-full">Actions</div>
                <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-1 w-42 p-2 shadow-xl border border-base-200">
                  <li>
                    <form action="{% url 'delete-property' property.pk %}" method="post" onsubmit="return confirm('Are you sure?')">
                      {% csrf_token %}
                      <button type="submit" class="text-error cursor-pointer">
                        Delete property
                      </button>
                    </form>
                  </li>
                  <li>
                    <a href="{% url 'edit-property' property.pk %}" class="flex justify-between items-center hover:text-primary">
                      Edit
                    </a>
                  </li>
                </ul>
              </div>

            </td>
          </tr>
        {% endfor %}
      </tbody>
    {% else %}
      <tbody>
        <tr>
          <td class="text-center py-4">No Properties found</td>
        </tr>
      </tbody>
    {% endif %}
  </table>
</div>
