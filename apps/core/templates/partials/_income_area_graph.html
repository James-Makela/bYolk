<div class="card bg-base-200">
  <div class="card-body">
    <h2 class="card-title">Income</h2>
    <div id="income-area-chart" class="w-full h-80 overflow-hidden"></div>
  </div>
</div>

{{ income_dates|json_script:"income-dates" }}
{{ income_titles|json_script:"income-titles" }}
{{ income_amounts|json_script:"income-amounts" }}
{{ total_spend_amounts|json_script:"total-spend-amounts" }}
<script>
  const dates = JSON.parse(document.getElementById('income-dates').textContent);
  const titles = JSON.parse(document.getElementById('income-titles').textContent);
  const amounts = JSON.parse(document.getElementById('income-amounts').textContent);
  const totalSpend = JSON.parse(document.getElementById('total-spend-amounts').textContent);
  renderIncomeChart(
    dates,
    titles,
    amounts,
    totalSpend,
    {{ request.session.privacy_mode|yesno:"true,false" }})
</script>
