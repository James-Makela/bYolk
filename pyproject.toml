[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_django = "django"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.coverage.run]
dynamic_context = "test_function"
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "budgetmaker.settings"

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true
