[project]
name = "byolk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Makela", email = "jamesilmarimakela@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django==6.1.1",
    "django-allauth==65.19.3",
    "django-environ==0.14.0",
    "django-pwa==2.0.1",
    "django-stubs-ext==6.1.1",
    "gunicorn==26.2.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "psycopg2-binary==2.9.13",
    "pymupdf==1.28.2",
    "whitenoise==6.12.0",
]

[dependency-groups]
ci = [
    "coverage==7.16.1",
    "django-stubs==6.1.1",
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260914",
    "types-python-dateutil==2.9.0.20260807",
    "types-pyyaml==6.0.12.20260906",
    "types-requests==2.33.0.20260906",
]

dev = [
    { include-group = "ci" },
    "pre-commit==4.6.2",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_django = "django"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.coverage.run]
dynamic_context = "test_function"
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "budgetmaker.settings"

[tool.zuban]
mode = "mypy"
strict = true
disallow_untyped_defs = true
warn_unreachable = true
follow_untyped_imports = true
exclude_gitignore = true
untyped_function_return_mode = "inferred"
warn_unused_ignores = true
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["*.migrations.*", "*.middleware", "*.manage.*", "*.tests"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.views"
disallow_untyped_defs = false
